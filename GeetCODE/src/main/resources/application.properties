spring.application.name=GeetCODE
server.port=8080

# 1. PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/geetcode
spring.datasource.username=postgres
spring.datasource.password=postgres
# 2. Tell JPA/Hibernate to automatically create/update SQL tables from our @Entity classes!
spring.jpa.hibernate.ddl-auto=update
# 3. Pass the Gemini API key to @Value("${gemini.api.key:}") in AiService
gemini.api.key=${GEMINI_API_KEY:}