services:
  backend:
    build:
      context: ./backend/api-service
    container_name: algou-backend
    ports:
      - "8080:8080"
    environment:
      - EXECUTION_ENGINE_URL=http://execution-engine:5000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-none}
      - JWT_SECRET=codenix-production-jwt-secret-key-256-bits-long-for-hs256-algorithm
    depends_on:
      - execution-engine

  execution-engine:
    build:
      context: ./backend/execution-service
    container_name: algou-execution
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
    container_name: algou-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
